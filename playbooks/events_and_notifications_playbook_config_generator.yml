---
- name: Generate YAML Configuration for Events and Notifications Management
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "credentials.yml"
  tasks:
    - name: Generate YAML Configuration for Events and Notifications Settings
      cisco.dnac.events_and_notifications_playbook_config_generator:
        dnac_host: "{{ dnac_host }}"
        dnac_username: "{{ dnac_username }}"
        dnac_password: "{{ dnac_password }}"
        dnac_verify: "{{ dnac_verify }}"
        dnac_port: "{{ dnac_port }}"
        dnac_version: "{{ dnac_version }}"
        dnac_debug: "{{ dnac_debug }}"
        dnac_log: true
        dnac_log_level: DEBUG
        dnac_api_task_timeout: 1000
        dnac_task_poll_interval: 1
        state: gathered
        file_path: events_and_notifications_playbook.yml
        file_mode: overwrite
        config:
          component_specific_filters:
            components_list:
              - webhook_destination
            webhook_destination:
              - name: ["webhook demo 103", "Events PCG Webhook 01"]
              - name: ["Events PCG Webhook 02"]

    - name: Generate YAML Configuration for email destinations only
      cisco.dnac.events_and_notifications_playbook_config_generator:
        dnac_host: "{{ dnac_host }}"
        dnac_username: "{{ dnac_username }}"
        dnac_password: "{{ dnac_password }}"
        dnac_verify: "{{ dnac_verify }}"
        dnac_port: "{{ dnac_port }}"
        dnac_version: "{{ dnac_version }}"
        dnac_debug: "{{ dnac_debug }}"
        dnac_log: true
        dnac_log_level: DEBUG
        dnac_api_task_timeout: 1000
        dnac_task_poll_interval: 1
        state: gathered
        file_path: events_and_notifications_email_destinations.yml
        file_mode: overwrite
        config:
          component_specific_filters:
            components_list:
              - email_destination
            email_destination:
              - sender_email: ["DNAC@cisco.com"]
              - recipient_email: ["uchandan@cisco.com"]

    - name: Generate YAML Configuration for webhook and email notifications
      cisco.dnac.events_and_notifications_playbook_config_generator:
        dnac_host: "{{ dnac_host }}"
        dnac_username: "{{ dnac_username }}"
        dnac_password: "{{ dnac_password }}"
        dnac_verify: "{{ dnac_verify }}"
        dnac_port: "{{ dnac_port }}"
        dnac_version: "{{ dnac_version }}"
        dnac_debug: "{{ dnac_debug }}"
        dnac_log: true
        dnac_log_level: DEBUG
        dnac_api_task_timeout: 1000
        dnac_task_poll_interval: 1
        state: gathered
        file_path: events_and_notifications_notifications.yml
        file_mode: overwrite
        config:
          component_specific_filters:
            components_list:
              - webhook_event_notification
              - email_event_notification
            webhook_event_notification:
              - name: ["test event"]
            email_event_notification:
              - name: ["EMAIL Notification 24", "EMAIL Notification 25"]

    - name: Generate YAML Configuration for ITSM settings only
      cisco.dnac.events_and_notifications_playbook_config_generator:
        dnac_host: "{{ dnac_host }}"
        dnac_username: "{{ dnac_username }}"
        dnac_password: "{{ dnac_password }}"
        dnac_verify: "{{ dnac_verify }}"
        dnac_port: "{{ dnac_port }}"
        dnac_version: "{{ dnac_version }}"
        dnac_debug: "{{ dnac_debug }}"
        dnac_log: true
        dnac_log_level: DEBUG
        dnac_api_task_timeout: 1000
        dnac_task_poll_interval: 1
        state: gathered
        file_path: events_and_notifications_itsm.yml
        file_mode: overwrite
        config:
          component_specific_filters:
            components_list:
              - itsm_setting
            itsm_setting:
              - instance_name: ["Playbook itsm demo 10"]

    - name: Generate YAML Configuration for mixed component filters
      cisco.dnac.events_and_notifications_playbook_config_generator:
        dnac_host: "{{ dnac_host }}"
        dnac_username: "{{ dnac_username }}"
        dnac_password: "{{ dnac_password }}"
        dnac_verify: "{{ dnac_verify }}"
        dnac_port: "{{ dnac_port }}"
        dnac_version: "{{ dnac_version }}"
        dnac_debug: "{{ dnac_debug }}"
        dnac_log: true
        dnac_log_level: DEBUG
        dnac_api_task_timeout: 1000
        dnac_task_poll_interval: 1
        state: gathered
        file_path: events_and_notifications_filtered_mix.yml
        file_mode: overwrite
        config:
          component_specific_filters:
            components_list:
              - webhook_destination
              - email_event_notification
              - email_destination
              - itsm_setting
              - syslog_destination
              - snmp_destination
              - webhook_event_notification
              - syslog_event_notification
            webhook_destination:
              - name: ["webhook demo 103", "Events PCG Webhook 01"]
              - name: ["Events PCG Webhook 02"]
            email_event_notification:
              - name: ["EMAIL Notification 24", "EMAIL Notification 25"]
              - name: ["EMAIL Notification 26"]
            email_destination:
              - sender_email: ["DNAC@cisco.com"]
              - recipient_email: ["uchandan@cisco.com"]
            itsm_setting:
              - instance_name: ["Playbook itsm demo 10"]
            syslog_destination:
              - name: ["Test_Syslog 101"]
            snmp_destination:
              - name: ["SNMP"]
            webhook_event_notification:
              - name: ["test event"]
            syslog_event_notification:
              - name: ["CG-Test"]
            
